<script>
(function(){
'use strict';
// ==LOGIC-START==
const CYCLE='休夜夜夜休休早早早中中中'.split('');
const ANCHOR=Date.UTC(2026,11,1)/864e5;               // 2026/12/01
const OFFS={A:1,B:4,C:7,D:10};                        // 起算日當天各組走到循環第幾天
const GROUPS=['日1','日2','A','B','C','D'];
const GNAME={'日1':'日班 B01（不分組）','日2':'日班 B02（常早班）',A:'A 班',B:'B 班',C:'C 班',D:'D 班'};
const TIMES={B01:[8,17],B02:[8,16],B03:[16,24],B04:[0,8]};
const BLABEL={B01:'日',B02:'早',B03:'中',B04:'夜'};
const p2=n=>String(n).padStart(2,'0');
const dn=(y,m,d)=>Math.floor(Date.UTC(y,m-1,d)/864e5);
const dim=(y,m)=>new Date(Date.UTC(y,m,0)).getUTCDate();
const wday=(y,m,d)=>(dn(y,m,d)+4)%7;                  // 0=日 … 6=六
const isRot=c=>OFFS[c]!==undefined;
const dkey=(y,m,d)=>y+'-'+p2(m)+'-'+p2(d);
const pb=s=>s.slice(0,3), pa=s=>s.slice(3);
const clone=o=>JSON.parse(JSON.stringify(o));
const HOL_DEFAULT=['2026-12-25','2027-01-01','2027-02-04','2027-02-05','2027-02-08','2027-02-09','2027-02-10','2027-03-01','2027-04-05','2027-04-06','2027-04-30','2027-06-09','2027-09-15','2027-09-28','2027-10-11','2027-10-25','2027-12-24','2027-12-31'];

function cycType(cat,y,m,d){ const p=(((OFFS[cat]-1+dn(y,m,d)-ANCHOR)%12)+12)%12; return CYCLE[p]; }
function typeOf(s){ const b=pb(s),a=pa(s); if(a[0]==='H') return '休'; return b==='B03'?'中':b==='B04'?'夜':'早'; }
function cycleCells(cat,y,m){
  const out=[]; for(let d=1;d<=dim(y,m);d++){
    const t=cycType(cat,y,m,d);
    out.push(t==='早'?['B02','W01']:t==='中'?['B03','W01']:t==='夜'?['B04','W01']:['B02','H01']);
  } return out;
}
function dayCells(hol,cat,y,m){
  const b=cat==='日1'?'B01':'B02', out=[];
  for(let d=1;d<=dim(y,m);d++){
    const w=wday(y,m,d);
    if(hol.has(dkey(y,m,d))) out.push(['B02','H05']);
    else if(w===6) out.push(['B02','H01']);
    else if(w===0) out.push(['B02','H03']);
    else out.push([b,'W01']);
  } return out;
}
// 休息日標籤 H05 > H03 > H01（與 Excel 版相同）：回傳 H03 不足天數
function labelRest(c,y,m,n05,n03){
  const isRest=x=>x[1]==='H01'||x[1]==='H03';
  let cnt=c.filter(x=>x[1]==='H05').length;
  while(cnt<n05){ const k=c.findIndex(isRest); if(k<0) break; c[k]=['B02','H05']; cnt++; }
  const take=new Set(); let sel=0;
  for(let k=0;k<c.length;k++) if(isRest(c[k])&&sel<n03&&wday(y,m,k+1)===0){ take.add(k); sel++; }
  for(let k=0;k<c.length;k++) if(isRest(c[k])&&!take.has(k)&&sel<n03){ take.add(k); sel++; }
  for(let k=0;k<c.length;k++) if(isRest(c[k])) c[k]=['B02',take.has(k)?'H03':'H01'];
  return Math.max(0,n03-sel);
}
function targets(cfg,y,m){
  const t=dayCells(new Set(cfg.holidays),'日2',y,m);
  return {n05:t.filter(c=>c[1]==='H05').length,n03:t.filter(c=>c[1]==='H03').length,n01:t.filter(c=>c[1]==='H01').length};
}
function genMonth(cfg,people,y,m){
  const hol=new Set(cfg.holidays), tg=targets(cfg,y,m), rows={};
  for(const p of people){
    let cells;
    if(isRot(p.cat)){ cells=cycleCells(p.cat,y,m); labelRest(cells,y,m,tg.n05,tg.n03); }
    else cells=dayCells(hol,p.cat,y,m);
    rows[p.id]=cells.map(c=>c[0]+c[1]);
  }
  return rows;
}
function newMonth(cfg,y,m,prevMonth){
  const people=clone(cfg.people), rows=genMonth(cfg,people,y,m), prev={};
  if(prevMonth){ const pn=dim(prevMonth.y,prevMonth.m); for(const p of people){ const r=prevMonth.rows[p.id]; if(r) prev[p.id]=r.slice(Math.max(0,pn-6),pn); } }
  return {y,m,people,rows,base:clone(rows),prev,marks:{},ts:Date.now()};
}
// 連續上班不超過 6 天、相鄰上班日休息大於 12 小時
function checkSeq(prev,cells,name){
  const out=[], seq=prev.concat(cells), off=prev.length; let run=0;
  for(let i=0;i<seq.length;i++){
    if(pa(seq[i])==='W01'){
      run++;
      if(run===7){ const d=i-off+1; if(d>=1) out.push({day:d,name,msg:`連續上班第 7 天（${d} 日）`}); }
    } else run=0;
    if(i>=1&&pa(seq[i])==='W01'&&pa(seq[i-1])==='W01'){
      const rest=24+TIMES[pb(seq[i])][0]-TIMES[pb(seq[i-1])][1], d=i-off+1;
      if(rest<=12&&d>=1) out.push({day:d,name,msg:`${d-1<1?'上月底':(d-1)+' 日'}→${d} 日休息只有 ${rest} 小時（需大於 12）`});
    }
  } return out;
}
function monthIssues(mo){
  const out=[];
  for(const p of mo.people){ const r=mo.rows[p.id]; if(!r) continue; for(const x of checkSeq(mo.prev[p.id]||[],r,p.name)) out.push({...x,pid:p.id}); }
  return out.sort((a,b)=>a.day-b.day);
}
function stats(rows){ let h5=0,h3=0,h1=0; for(const s of rows){ const a=pa(s); if(a==='H05')h5++; else if(a==='H03')h3++; else if(a==='H01')h1++; } return {h5,h3,h1}; }
// 回推檢查：最後 14 天與組別循環不同的天數
function lookback(mo,limit){
  const n=dim(mo.y,mo.m), s=Math.max(1,n-13), out=[];
  for(const p of mo.people){ if(!isRot(p.cat)) continue; const r=mo.rows[p.id]; let diff=0;
    for(let d=s;d<=n;d++) if(typeOf(r[d-1])!==cycType(p.cat,mo.y,mo.m,d)) diff++;
    if(diff>=limit) out.push({pid:p.id,name:p.name,diff}); }
  return out;
}
function sortedPeople(people){
  return people.map((p,i)=>({p,i})).sort((x,y)=>
    (x.p.tail?1:0)-(y.p.tail?1:0) || GROUPS.indexOf(x.p.cat)-GROUPS.indexOf(y.p.cat) || x.i-y.i).map(o=>o.p);
}
// 調換：mode 'swap'＝換班（只換 d1~d2 的班別碼）；'group'＝調班別（d1 起兩人互換班別碼與組別、位置）
function doSwap(mo,master,mode,idA,idB,d1,d2){
  const m=clone(mo), n=dim(m.y,m.m), end=mode==='group'?n:d2;
  const last={type:mode,a:idA,b:idB,d1,d2:end,rowsA:mo.rows[idA].slice(),rowsB:mo.rows[idB].slice(),baseA:mo.base[idA].slice(),baseB:mo.base[idB].slice(),
    marks:clone(mo.marks),people:clone(mo.people),master:clone(master)};
  for(let d=d1;d<=end;d++){
    [m.rows[idA][d-1],m.rows[idB][d-1]]=[m.rows[idB][d-1],m.rows[idA][d-1]];
    if(mode==='group') [m.base[idA][d-1],m.base[idB][d-1]]=[m.base[idB][d-1],m.base[idA][d-1]];
  }
  let mp=clone(master);
  if(mode==='group'){
    const swapGrp=list=>{ const ia=list.findIndex(p=>p.id===idA), ib=list.findIndex(p=>p.id===idB); if(ia<0||ib<0) return;
      const a=list[ia], b=list[ib], c=a.cat, t=!!a.tail; a.cat=b.cat; a.tail=!!b.tail; b.cat=c; b.tail=t; list[ia]=b; list[ib]=a; };
    swapGrp(m.people); swapGrp(mp.people);
    m.marks[idA]=2; m.marks[idB]=2;
  } else { if(m.marks[idA]!==2) m.marks[idA]=1; if(m.marks[idB]!==2) m.marks[idB]=1; }
  m.ts=Date.now();
  return {month:m,master:mp,last};
}

function closeModal(){ $('#modal').innerHTML=''; S.modal=null; closePop(); }
function closePop(){ const p=$('#pop'); if(p) p.innerHTML=''; S.pick=null; }
const CODES=[['早 B02','B02W01'],['中 B03','B03W01'],['夜 B04','B04W01'],['日 B01','B01W01'],['休 H01 週六','B02H01'],['休 H03 週日','B02H03'],['休 H05 國定','B02H05']];
function openPop(td){
  const mo=curMonth(), p=mo.people.find(x=>x.id===td.dataset.p), d=+td.dataset.d; if(!p) return;
  const base=(mo.base[p.id]||[])[d-1], cur=mo.rows[p.id][d-1], r=td.getBoundingClientRect();
  S.pick={p:p.id,d}; render_keep();
  const el=$('#pop'); const x=Math.min(r.left,innerWidth-226), y=Math.min(r.bottom+4,innerHeight-260);
  el.innerHTML=`<div class="pop" style="left:${Math.max(8,x)}px;top:${Math.max(8,y)}px" role="menu"><div class="cap">${esc(p.name)}・${d} 日（目前 ${esc(cur)}）</div>${CODES.map(c=>`<button data-act="setcell" data-code="${c[1]}" ${c[1]===cur?'disabled':''}>${c[0]}</button>`).join('')}${base&&base!==cur?`<button data-act="setcell" data-code="${base}" style="grid-column:1/-1">還原成基礎班表（${esc(base)}）</button>`:''}<button data-act="popclose" style="grid-column:1/-1">取消</button></div>`;
}
function render_keep(){ render(); }
function setCell(pid,d,code){
  const mo=clone(curMonth()); mo.rows[pid][d-1]=code; mo.ts=Date.now(); delete mo.last; saveMonth(mo); closePop(); render();
}

// ---------- 人員視窗 ----------
function personDlg(pid){
  const mo=curMonth(), p=mo.people.find(x=>x.id===pid); if(!p) return;
  const r=mo.rows[pid]||[], n=dim(mo.y,mo.m), st=stats(r), w0=wday(mo.y,mo.m,1), iss=monthIssues(mo).filter(x=>x.pid===pid);
  let cal=['日','一','二','三','四','五','六'].map(x=>`<div class="h">${x}</div>`).join('')+'<div style="background:none"></div>'.repeat(w0);
  for(let d=1;d<=n;d++){ const s=r[d-1],b=pb(s),a=pa(s),rest=a[0]==='H'; const bg=rest?'t-rest':b==='B01'?'t-day':b==='B02'?'t-early':b==='B03'?'t-mid':'t-night';
    cal+=`<div style="background:${rest?'var(--t-rest)':'transparent'}"><b>${d}</b>${rest?'休':BLABEL[b]}${rest?`<b>${a}</b>`:`<b>${b}</b>`}</div>`; }
  const gl=p.tail?'表尾（'+GNAME[p.cat]+'）':GNAME[p.cat];
  openModal(`<h2>${esc(p.name)}・${monthLabel(mo)}</h2><div class="note">${esc(gl)}　休息日：H05 ${st.h5}、H03 ${st.h3}、H01 ${st.h1}</div><div class="cal">${cal}</div>
  ${iss.length?`<h4>這個人的違規</h4><div class="list bad">${iss.map(x=>`<div>${esc(x.msg)}</div>`).join('')}</div>`:''}
  <div class="acts"><button class="btn" data-act="close">關閉</button></div>`);
}

// ---------- 調換 ----------
function swapDlg(){
  const mo=curMonth(), rot=sortedPeople(mo.people).filter(p=>isRot(p.cat)), n=dim(mo.y,mo.m);
  const opt=sel=>rot.map(p=>`<option value="${esc(p.id)}" ${p.id===sel?'selected':''}>${esc(p.name)}（${p.tail?'表尾 ':''}${GNAME[p.cat]}）</option>`).join('');
  const days=sel=>Array.from({length:n},(_,i)=>`<option value="${i+1}" ${i+1===sel?'selected':''}>${i+1} 日</option>`).join('');
  openModal(`<h2>調換輪班組員</h2><p class="note">只能調換輪班 A–D 的組員。日班或不分組的人要改類別，請到「設定」調整類別（下個月生效）。</p>
  <div class="row"><label><input type="radio" name="mode" value="swap" checked>換班：只換指定日期的班別碼，組別不變</label></div>
  <div class="row"><label><input type="radio" name="mode" value="group">調班別：從指定日起兩人互換班別碼、組別與位置，下月起依新組循環</label></div>
  <div class="row"><select class="field" id="sa">${opt(rot[0]&&rot[0].id)}</select><span>與</span><select class="field" id="sb">${opt(rot[1]&&rot[1].id)}</select></div>
  <div class="row"><span>從</span><select class="field" id="sd1">${days(1)}</select><span id="sto"><span>到</span> <select class="field" id="sd2">${days(1)}</select></span></div>
  <div id="sprev"></div><div class="acts"><button class="btn" data-act="close">取消</button><button class="btn pri" data-act="doswap" id="sgo" disabled>套用</button></div>`,()=>{ swapPrev(); });
}
function swapVals(){ const g=id=>$('#'+id); const mode=document.querySelector('input[name=mode]:checked').value; return {mode,a:g('sa').value,b:g('sb').value,d1:+g('sd1').value,d2:+g('sd2').value}; }
function swapPrev(){
  const v=swapVals(), mo=curMonth(), el=$('#sprev'), go=$('#sgo'); $('#sto').style.display=v.mode==='group'?'none':'';
  if(v.a===v.b){ el.innerHTML='<div class="list bad">請選兩位不同的人。</div>'; go.disabled=true; return; }
  if(v.mode==='swap'&&v.d2<v.d1){ el.innerHTML='<div class="list bad">結束日不能早於開始日。</div>'; go.disabled=true; return; }
  const r=doSwap(mo,S.cfg,v.mode,v.a,v.b,v.d1,v.d2), before=monthIssues(mo).filter(x=>x.pid===v.a||x.pid===v.b).map(x=>x.pid+x.msg);
  const after=monthIssues(r.month).filter(x=>x.pid===v.a||x.pid===v.b), neu=after.filter(x=>!before.includes(x.pid+x.msg));
  const A=mo.people.find(p=>p.id===v.a),B=mo.people.find(p=>p.id===v.b), n=dim(mo.y,mo.m), e=v.mode==='group'?n:v.d2;
  const cnt=pid=>stats(r.month.rows[pid]), ca=cnt(v.a), cb=cnt(v.b), tg=targets(S.cfg,mo.y,mo.m), warn=[];
  for(const [p,c] of [[A,ca],[B,cb]]){ if(c.h5!==tg.n05) warn.push(`${p.name} 的 H05 是 ${c.h5} 天（日班為 ${tg.n05}）`); if(c.h3!==tg.n03) warn.push(`${p.name} 的 H03 是 ${c.h3} 天（日班為 ${tg.n03}）`); }
  el.innerHTML=`<h4>預覽：${esc(A.name)} 與 ${esc(B.name)}，${v.d1}–${e} 日互換${v.mode==='group'?'（含組別：'+GNAME[A.cat]+' ⇄ '+GNAME[B.cat]+'）':''}</h4>`+
   (neu.length?`<div class="list bad"><b>調換後新增 ${neu.length} 項違規：</b>${neu.map(x=>`<div>${esc(x.name)}：${esc(x.msg)}</div>`).join('')}</div>`:'<div class="list"><span style="color:var(--ok)">沒有新增違規。</span></div>')+
   (warn.length?`<div class="note" style="margin-top:6px">提醒：${warn.map(esc).join('；')}。需要的話套用後再點格子手動調整。</div>`:'');
  go.disabled=false; go.textContent=neu.length?'仍要套用':'套用';
}
function doSwapApply(){
  const v=swapVals(), r=doSwap(curMonth(),S.cfg,v.mode,v.a,v.b,v.d1,v.d2);
  r.month.last=r.last; saveMonth(r.month);
  if(v.mode==='group'){ S.cfg=normCfg(r.master); saveCfg(); }
  closeModal(); render(); toast(v.mode==='group'?'已調班別，下月起依新組循環':'已換班');
}
function undoApply(){
  const mo=curMonth(), u=undoSwap(mo); if(!u) return; saveMonth(u.month);
  if(mo.last&&mo.last.type==='group'){ S.cfg=normCfg(u.master); saveCfg(); }
  render(); toast('已復原');
}

// ---------- 產生下月 ----------

function genApply(){
  const mo=curMonth(), tid=nextId(mo.y,mo.m), t=parseId(tid), nm=newMonth(S.cfg,t.y,t.m,mo), iss=monthIssues(nm);

}

// ---------- 設定 ----------
function settingsDlg(){
  const c=S.cfg; const catOpt=sel=>GROUPS.map(g=>`<option value="${g}" ${g===sel?'selected':''}>${GNAME[g]}</option>`).join('');
  const rows=c.people.map((p,i)=>`<tr data-i="${i}"><td><input type="text" class="field pn" value="${esc(p.name)}" aria-label="姓名"></td><td><select class="field pc" aria-label="類別">${catOpt(p.cat)}</select></td><td><label><input type="checkbox" class="pt_" ${p.tail?'checked':''}> 表尾</label></td><td><input type="tel" class="field pe" inputmode="numeric" pattern="[0-9]*" placeholder="${p.hash?'已設定':'工號'}" aria-label="工號" style="width:90px"></td><td><button class="btn dng" data-act="delp" type="button" aria-label="刪除">刪</button></td></tr>`).join('');
  openModal(`<h2>設定</h2><p class="note">這裡改的是「主名單」，下次產生下月班表時套用；目前這個月不會變。調班別會自動同步主名單。</p>
  <h4>人員（名單順序＝同組內的順序）</h4><div class="list" style="max-height:260px"><table class="pt"><thead><tr><th>姓名</th><th>類別</th><th>位置</th><th>工號（不改請留空）</th><th></th></tr></thead><tbody id="ptb">${rows}</tbody></table></div>
  <div class="row"><button class="btn" data-act="addp" type="button">新增一人</button></div>
  <h4>貼上人員名單取代上面的人員（每行：姓名，類別；類別填 A、B、C、D、日1、日2，後面加「,尾」表示放在表尾）</h4><textarea class="field" id="imp" rows="4" style="width:100%" placeholder="王小明,A&#10;李小華,日2&#10;陳大文,B,尾"></textarea><div class="row"><button class="btn" data-act="doimp" type="button">用貼上的名單取代</button></div>
  <h4>國定假日（含補假，每行一天，格式 2027-02-04；只填週一到週五，週六日本來就休）</h4><textarea class="field" id="hol" rows="6" style="width:100%">${esc(c.holidays.join('\n'))}</textarea>
  <div class="note">來源：人事行政總處 116 年（2027）辦公日曆。每年 6 月底前公告次年日曆後，把新日期加進來。</div>
  <h4>規則</h4><div class="row"><label>回推檢查差異上限 <input type="number" class="field" id="lim" min="1" max="14" value="${c.limit}" style="width:70px"> 天（最後 14 天與循環不同的天數達到就先提醒）</label></div>
  <div class="note">循環：${CYCLE.join('')}（12 天）・起算日 2026/12/01・A/B/C/D 在起算日走到第 1/4/7/10 天。這些寫在程式裡，要改請告訴我。</div>
  <div class="acts"><button class="btn" data-act="close">取消</button><button class="btn pri" data-act="savecfg">儲存設定</button></div>`);
}
async function readPeople(){
  const out=[], rows=[...document.querySelectorAll('#ptb tr')];
  for(let i=0;i<rows.length;i++){
    const tr=rows[i], old=S.cfg.people[+tr.dataset.i]||null, name=tr.querySelector('.pn').value.trim();
    if(!name) continue;
    const emp=((tr.querySelector('.pe')||{}).value||'').trim();
    let hash=old&&old.hash?old.hash:'';
    if(emp) hash=await empHash(emp);
    out.push({id:old?old.id:'p'+Date.now().toString(36)+i,name,cat:tr.querySelector('.pc').value,tail:tr.querySelector('.pt_').checked,hash});
  }
  return out;
}
async function saveSettings(){
  const people=await readPeople(), seen=new Set();
  for(const p of people){ if(seen.has(p.name)){ toast('有重複的姓名：'+p.name); return; } seen.add(p.name); }
  const hol=$('#hol').value.split(/\s+/).filter(Boolean), badH=hol.filter(x=>!/^\d{4}-\d{2}-\d{2}$/.test(x));
  if(badH.length){ toast('假日格式不對：'+badH[0]); return; }
  S.cfg={people,holidays:[...new Set(hol)].sort(),limit:Math.max(1,Math.min(14,+$('#lim').value||4))}; saveCfg(); closeModal(); render(); toast('已儲存設定');
}
function importPeople(){
  const lines=$('#imp').value.split(/\n/).map(s=>s.trim()).filter(Boolean), out=[], badL=[];
  lines.forEach((l,i)=>{ const f=l.split(/[,，\t]/).map(s=>s.trim()); const cat=(f[1]||'').replace(/班/,'').toUpperCase().replace(/^日班?B?0?1$/,'日1').replace(/^日班?B?0?2$/,'日2');
    if(!f[0]||!GROUPS.includes(cat)){ badL.push(i+1); return; } out.push({id:'p'+Date.now().toString(36)+i,name:f[0],cat,tail:/^(尾|表尾)$/.test(f[2]||''),hash:(S.cfg.people.find(x=>x.name===f[0])||{}).hash||''}); });
  if(badL.length){ toast('第 '+badL.join('、')+' 行格式不對（類別要是 A、B、C、D、日1、日2）'); return; }
  if(!out.length){ toast('沒有可匯入的行'); return; }
  S.cfg.people=out; settingsDlg(); toast('已換成貼上的 '+out.length+' 人，記得按「儲存設定」');
}


// ---------- 排休（每人一份文件，寫入者只能是自己的帳號） ----------
function leaveKeys(y,m){
  const set=new Set(), mm=mid(y,m);
  for(const uid of Object.keys(S.leave)){ const d=S.leave[uid]; if(!d||!d.personId||!d.dates) continue;
    for(const day of (d.dates[mm]||[])) set.add(d.personId+':'+day); }
  return set;
}
const EMP_SALT='';
function empNorm(e){ let v=String(e||'').trim().toLowerCase(); if(/^\d+$/.test(v)) v='c'+v; return v; }
async function empHash(e){ const d=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(EMP_SALT+':'+empNorm(e))); return [...new Uint8Array(d)].map(x=>x.toString(16).padStart(2,'0')).join(''); }
function boundPerson(){ const mine=S.leave[S.uid]||{}; const id=mine.personId||S.me; return id?S.cfg.people.find(x=>x.id===id)||null:null; }
function leaveDlg(){
  if(!S.db){ toast('目前沒有連到資料庫，無法排休'); return; }
  if(!S.uid){ toast('請用自己的帳號開啟頁面才能排休'); return; }
  const mo=curMonth(), me=boundPerson();
  if(!me){
    openModal(`<h2>排休・核定身分</h2><p class="note">請輸入你的工號。核定後就可以自己排休日期。</p>
    <div class="row"><input class="field" id="lvemp" type="tel" inputmode="numeric" pattern="[0-9]*" autocomplete="off" placeholder="工號（只要數字）" style="width:200px"></div>
    <div class="acts"><button class="btn" data-act="close">取消</button><button class="btn pri" data-act="lvverify">核定</button></div>`);
    return;
  }
  const mine=S.leave[S.uid]||{}, n=dim(mo.y,mo.m), cur=((mine.dates||{})[mid(mo.y,mo.m)])||[];
  let cal=['日','一','二','三','四','五','六'].map(x=>`<div class="h">${x}</div>`).join('')+'<div style="background:none"></div>'.repeat(wday(mo.y,mo.m,1));
  for(let d=1;d<=n;d++){ const on=cur.includes(d); cal+=`<div><button type="button" class="dayb${on?' on':''}" data-act="lvday" data-d="${d}" aria-pressed="${on}">${d}<small>${'日一二三四五六'[wday(mo.y,mo.m,d)]}</small></button></div>`; }
  openModal(`<h2>我的排休・${monthLabel(mo)}</h2><p class="note">${esc(me.name)}，點日期可以切換排休。班表上會用紅點標示，不影響自動排班。</p>
  <div class="cal" id="lvcal">${cal}</div>
  <div class="acts"><button class="btn" data-act="close">取消</button><button class="btn pri" data-act="lvsave">儲存排休</button></div>`);
}
async function leaveVerify(){
  const v=(($('#lvemp')||{}).value||'').trim();
  if(!v){ toast('請輸入工號'); return; }
  let h; try{ h=await empHash(v); }catch(err){ toast('這個瀏覽器無法比對工號'); return; }
  const p=S.cfg.people.find(x=>x.hash&&x.hash===h);
  if(!p){ toast('工號不正確，或不在名單上'); return; }
  const prev=clone(S.leave[S.uid]||{}), doc={personId:p.id,name:p.name,dates:prev.dates||{},updated:Date.now()};
  try{ await S.db.doc('leave/'+S.uid).set(doc); S.leave[S.uid]=doc; toast('已核定：'+p.name); render(); leaveDlg(); }
  catch(err){ toast('儲存失敗：'+((err&&err.code)||(err&&err.message)||err)); }
}
async function leaveSave(){
  const mo=curMonth(), me=boundPerson();
  if(!me){ toast('請先核定工號'); return; }
  const days=[...document.querySelectorAll('#lvcal .dayb.on')].map(b=>+b.dataset.d).sort((x,y)=>x-y);
  const prev=clone(S.leave[S.uid]||{}), dates=prev.dates||{}, key=mid(mo.y,mo.m);
  if(days.length) dates[key]=days; else delete dates[key];
  const doc={personId:me.id,name:me.name,dates,updated:Date.now()};
  try{ await S.db.doc('leave/'+S.uid).set(doc); S.leave[S.uid]=doc; closeModal(); render(); toast('已儲存排休（'+me.name+'，'+days.length+' 天）'); }
  catch(e){ toast('儲存失敗：'+((e&&e.code)||(e&&e.message)||e)); }
}
function leaveToggle(btn){ const on=!btn.classList.contains('on'); btn.classList.toggle('on',on); btn.setAttribute('aria-pressed',on); }

// ---------- 事件 ----------
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act],td.c'); if(!t){ if(!e.target.closest('.pop')) closePop(); return; }
  if(t.matches('td.c')){ if(S.canEdit&&!S.modal) openPop(t); return; }
  const act=t.dataset.act;
  if(act==='ovclose'){ if(e.target===t) closeModal(); return; }
  if(act==='close') return closeModal();
  if(act==='popclose'){ closePop(); render(); return; }
  if(act==='setcell'){ const p=S.pick; setCell(p.p,p.d,t.dataset.code); return; }
  if(act==='prev'||act==='next'){ const l=ids(), i=l.indexOf(S.cur)+(act==='next'?1:-1); if(l[i]){ S.cur=l[i]; render(); } return; }
  if(act==='person') return personDlg(t.dataset.p);
  if(act==='goto'){ const c=document.querySelector(`td.c[data-p="${CSS.escape(t.dataset.p)}"][data-d="${t.dataset.d}"]`); if(c) c.scrollIntoView({block:'center',inline:'center'}); return; }
  if(act==='seed') return seedDb();
  if(act==='logout'){ gateClear(); S.me=null; S.adm=false; render(); gateShow(); return; }
  if(act==='exportcsv'){ if(typeof exportLeaveCsv==='function') exportLeaveCsv(); return; }
  if(act==='importcsv'){ if(typeof importLeaveCsvPick==='function') importLeaveCsvPick(); return; }
  if(act==='admsched'){ if(typeof admSched==='function') admSched(); return; }
  if(act==='importsched'){ if(typeof importSchedPick==='function') importSchedPick(); return; }
  if(act==='admlogin'){ if(typeof admLogin==='function') admLogin(); return; }
  if(act==='admverify'){ if(typeof admVerify==='function') admVerify(); return; }
  if(act==='admimport'){ if(typeof admImport==='function') admImport(); return; }
  if(act==='leave') return leaveDlg(); if(act==='lvsave') return leaveSave(); if(act==='lvverify') return leaveVerify(); if(act==='lvday') return leaveToggle(t);
  if(act==='gen') return genDlg(); if(act==='dogen') return genApply();

async function importLeaveCsvFile(f){
  const mo=curMonth(); if(!mo){ toast('請先選月份'); return; }
  const mm=mid(mo.y,mo.m);
  // 先以 UTF-8 解碼；若含非法位元組（例如被 Excel 另存成 Big5），改用 Big5
  const buf=await f.arrayBuffer(); let text;
  try{ text=new TextDecoder('utf-8',{fatal:true}).decode(buf); }catch(e){ text=new TextDecoder('big5').decode(buf); }
  if(text.charCodeAt(0)===0xFEFF) text=text.slice(1);
  const lines=text.replace(/\r/g,'').split('\n');
  const days={}; const bad=[]; let cnt=0;
  for(let i=1;i<lines.length;i++){
    const L=lines[i].trim(); if(!L) continue;
    const parts=L.split(/[,\t]/).map(s=>(s||'').trim());   // 逗號或 Tab 分隔
    const m=/^員(\d{2})$/.exec(parts[0]||'');
    const dm=/^(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})$/.exec(parts[1]||'');   // 2026-11-03 或 2026/11/3
    const date=dm?dm[1]+'-'+dm[2].padStart(2,'0')+'-'+dm[3].padStart(2,'0'):'';
    if(!m || +m[1]<1 || +m[1]>S.cfg.people.length || !dm){ bad.push(L); continue; }
    if(date.slice(0,7)!==mm) continue;
    const d=+date.slice(8,10);
    if(d<1 || d>dim(mo.y,mo.m)){ bad.push(L); continue; }
    const pid='p'+m[1];
    (days[pid]=days[pid]||[]).push(d); cnt++;
  }
  window.__pendingImport={month:mm,days};
  openModal(`<h2>匯入排休・${monthLabel(mo)}</h2>
  <p class="note">檔案中本月共 ${cnt} 筆排休${bad.length?'，另有 '+bad.length+' 行格式不對會略過':''}。</p>
  <p class="note">CSV 會取代本月全部人的排休：沒有出現在檔案裡的人，本月排休會清空。</p>
  <div class="row"><input class="field" id="admpw" type="password" autocomplete="off" placeholder="管理密碼" style="width:220px"></div>
  <p class="note" id="admstat" role="status" style="min-height:1.5em;font-weight:700"></p>

}

async function importSchedFile0(f){
  const buf=await f.arrayBuffer(); let text;
  try{ text=new TextDecoder('utf-8',{fatal:true}).decode(buf); }catch(e){ text=new TextDecoder('big5').decode(buf); }
  if(text.charCodeAt(0)===0xFEFF) text=text.slice(1);
  const lines=text.replace(/\r/g,'').split('\n'), months={}, bad=[];
  for(let i=0;i<lines.length;i++){
    const L=lines[i].trim(); if(!L) continue;
    const p=L.split(/[,\t]/).map(s=>(s||'').trim());
    const mc=/^員(\d{2})$/.exec(p[0]||'');
    if(!mc){ if(i>0) bad.push(L); continue; }                       // 第一行視為標題
    const dm=/^(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})$/.exec(p[1]||''), code=(p[2]||'').toUpperCase();
    if(!dm||!SCHED_CODE.test(code)){ bad.push(L); continue; }
    const y=+dm[1], m=+dm[2], d=+dm[3], n=new Date(Date.UTC(y,m,0)).getUTCDate();
    if(m<1||m>12||d<1||d>n){ bad.push(L); continue; }
    const mm=y+'-'+String(m).padStart(2,'0'), pid='p'+mc[1];
    const o=months[mm]||(months[mm]={n,rows:{},names:{}});
    const r=o.rows[pid]||(o.rows[pid]=new Array(n).fill(null)); r[d-1]=code;
    if(p[3]) o.names[pid]=p[3];
  }
  const probs=[], summary=[]; let blockNames=0; const sample=[];
  for(const mm of Object.keys(months).sort()){
    const o=months[mm], pids=Object.keys(o.rows).sort(); let miss=0;
    for(const pid of pids) miss+=o.rows[pid].filter(x=>!x).length;
    if(miss) probs.push(mm+' 有 '+miss+' 格缺資料（每人每天都要有班別）');
    summary.push(mm+'：'+pids.length+' 人 × '+o.n+' 日 = '+(pids.length*o.n)+' 格');
    const missing=S.cfg.people.map(x=>x.id).filter(id=>!o.rows[id]);
    if(missing.length) probs.push(mm+' 缺少 '+missing.length+' 位：'+missing.slice(0,8).map(id=>'員'+id.slice(1)).join('、')+(missing.length>8?'…':'')+'（每位組員都要有整月班表）');
    for(const pid of pids){ const cp=S.cfg.people.find(x=>x.id===pid);
      if(!cp){ probs.push('員'+pid.slice(1)+' 不在網頁名單內（需要先更新 Cloudflare 的工號對照）'); continue; }
      const nm=o.names[pid]; if(nm&&nm!==cp.name){ blockNames++; if(sample.length<5) sample.push('員'+pid.slice(1)+'：網頁「'+cp.name+'」≠ 檔案「'+nm+'」'); } }
  }
  if(!Object.keys(months).length) probs.push('檔案裡沒有可用的班表資料');
  if(blockNames) probs.push('有 '+blockNames+' 位的姓名與網頁名單不符，代號順序可能不一致：'+sample.join('；'));
  window.__pendingSched=probs.length?null:months;
  openModal(`<h2>匯入班表</h2>
  <p class="note">${summary.map(esc).join('<br>')||'—'}${bad.length?'<br>另有 '+bad.length+' 行格式不對會略過':''}</p>
  ${probs.length?'<p class="note" style="color:#e5534b;font-weight:700">'+probs.map(esc).join('<br>')+'<br>請先修正再匯入，目前不能寫入。</p>':'<p class="note">匯入會取代檔案裡出現的月份（整月班表）。</p><div class="row"><input class="field" id="admpw2" type="password" autocomplete="off" placeholder="管理密碼" style="width:220px"></div>'}
  <p class="note" id="admstat2" role="status" style="min-height:1.5em;font-weight:700"></p>
  <div class="acts"><button class="btn" data-act="close">${probs.length?'關閉':'取消'}</button>${probs.length?'':'<button class="btn pri" id="admbtn2" data-act="admsched">寫入後端</button>'}</div>`);
}

    const j=await r.json();
    if(!r.ok){ toast(j.error||'儲存失敗'); return; }
    S.leave[S.me]={personId:S.me,dates:j.months};
    closeModal(); render(); toast('已儲存排休（'+days.length+' 天）');
  }catch(e){ toast('連不到伺服器，請稍後再試'); }
}
(async function loadLeave(){
  try{
    const r=await fetch(API+'/api/leave'); const j=await r.json();
    const L={}; for(const pid of Object.keys(j.leave||{})) L[pid]={personId:pid,dates:j.leave[pid]};
    S.leave=L; render();
  }catch(e){}
})();

})();
</script>
