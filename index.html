<title>輪班便當 v1.99</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#f3f5f8; --surface:#ffffff; --fg:#17202c; --muted:#5b6878; --line:#d3dae3; --line-strong:#2a3544;
  --accent:#1c5fb8; --accent-fg:#ffffff; --accent-soft:#dfeafa; --danger:#b3261e; --danger-soft:#fbe3e0; --ok:#1d7a46; --warn-soft:#fff2c4;
  --g-日1:#f6f0d2; --g-日2:#e9ecf1; --g-A:#f4dfe7; --g-B:#f6e6d3; --g-C:#dce8f5; --g-D:#dfeedb; --g-tail:#f3dfdb;
  --leave:#ffd93b; --t-early:#f8eece; --t-mid:#d6ece8; --t-night:#e0e1f2; --t-rest:#fbd9d6; --t-day:#fbf8e6;
  --we:#8c1d2b; --we-fg:#ffe98a; --ho:#f7b9c8; --ho-fg:#7a1230; --shadow:0 8px 28px rgba(15,25,40,.18);
  --font:"Noto Sans TC","PingFang TC","Microsoft JhengHei","Heiti TC",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12171e; --surface:#1b222c; --fg:#e8edf3; --muted:#9aa7b6; --line:#334052; --line-strong:#a9b6c6;
  --accent:#6aa5ee; --accent-fg:#0d1622; --accent-soft:#223652; --danger:#ff8f86; --danger-soft:#4a2320; --ok:#6fd59a; --warn-soft:#4a3f12;
  --g-日1:#3f3b2a; --g-日2:#343a42; --g-A:#3f303a; --g-B:#403629; --g-C:#2f3f52; --g-D:#324536; --g-tail:#41322f;
  --leave:#e0b72a; --t-early:#4b4428; --t-mid:#244440; --t-night:#2f3350; --t-rest:#4a2725; --t-day:#423e2b;
  --we:#5b1620; --we-fg:#ffe98a; --ho:#7a2a3f; --ho-fg:#ffd5df; --shadow:0 8px 28px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12171e; --surface:#1b222c; --fg:#e8edf3; --muted:#9aa7b6; --line:#334052; --line-strong:#a9b6c6;
  --accent:#6aa5ee; --accent-fg:#0d1622; --accent-soft:#223652; --danger:#ff8f86; --danger-soft:#4a2320; --ok:#6fd59a; --warn-soft:#4a3f12;
  --g-日1:#3f3b2a; --g-日2:#343a42; --g-A:#3f303a; --g-B:#403629; --g-C:#2f3f52; --g-D:#324536; --g-tail:#41322f;
  --leave:#e0b72a; --t-early:#4b4428; --t-mid:#244440; --t-night:#2f3350; --t-rest:#4a2725; --t-day:#423e2b;
  --we:#5b1620; --we-fg:#ffe98a; --ho:#7a2a3f; --ho-fg:#ffd5df; --shadow:0 8px 28px rgba(0,0,0,.5); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 40px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;margin-bottom:12px}
.brand{display:flex;align-items:baseline;gap:10px;margin-right:auto}
h1{margin:0;font-size:22px;font-weight:700;letter-spacing:.04em}
.tag{font-size:12px;color:var(--muted)}
.mnav{display:flex;align-items:center;gap:6px}
.mnav strong{min-width:150px;text-align:center;font-size:16px;font-variant-numeric:tabular-nums}
.mnav small{display:block;font-weight:400;color:var(--muted);font-size:11px}
.ib{border:1px solid var(--line);background:var(--surface);border-radius:6px;width:34px;height:34px;font-size:18px;line-height:1}
.ib:disabled{opacity:.35;cursor:default}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:12px;padding:2px 9px;border-radius:99px;border:1px solid var(--line);background:var(--surface);color:var(--muted)}
.chip.on{background:var(--accent-soft);color:var(--accent);border-color:transparent;font-weight:500}
.chip.warn{background:var(--warn-soft);color:var(--fg);border-color:transparent}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 13px;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.dng{color:var(--danger)}
.btn:disabled{opacity:.4;cursor:default}
.sp{flex:1}
.search{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 10px;min-width:150px}
.banner{background:var(--warn-soft);border-radius:6px;padding:8px 12px;margin-bottom:10px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.banner.err{background:var(--danger-soft)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted);margin:2px 0 8px}
.legend i{display:inline-block;width:14px;height:14px;border-radius:3px;vertical-align:-3px;margin-right:4px;border:1px solid var(--line)}
.wrap{overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:8px;max-height:calc(100vh - 220px);min-height:200px}
table{border-collapse:separate;border-spacing:0;font-variant-numeric:tabular-nums}
th,td{padding:0;text-align:center;font-size:12px;white-space:nowrap}
thead th{position:sticky;top:0;z-index:4;background:var(--surface);border-bottom:2px solid var(--line-strong);height:38px;min-width:33px;font-weight:500}
thead th span{display:block;font-size:10px;color:var(--muted);font-weight:400}
thead th.we{background:var(--we);color:var(--we-fg)} thead th.we span{color:var(--we-fg)}
thead th.ho{background:var(--ho);color:var(--ho-fg)} thead th.ho span{color:var(--ho-fg)}
.nm{position:sticky;left:0;z-index:3;text-align:left;min-width:108px;max-width:108px;padding:0 8px;border-right:2px solid var(--line-strong)}
thead th.nm{z-index:6;background:var(--surface)}
.nm button{all:unset;cursor:pointer;display:block;width:100%;padding:7px 0;overflow:hidden;text-overflow:ellipsis;font-size:13px;font-weight:500}
.nm button:focus-visible{outline:2px solid var(--accent)}
.nm.mk1{box-shadow:inset 5px 0 0 #f2c200}
.nm.mk2 button{background:#f3e39a;color:#2a2200;border-radius:3px;padding-left:4px}
tr.blk td{height:24px;text-align:left;font-size:12px;font-weight:700;letter-spacing:.06em;border-top:3px solid var(--line-strong);padding:0}
tr.blk td div{position:sticky;left:0;display:inline-block;padding:3px 10px;width:max-content}
tr.blk td.fill{border-top:3px solid var(--line-strong)}
tr.first td,tr.first th{border-top:0}
tbody tr:not(.blk) td,tbody tr:not(.blk) th{border-top:1px solid var(--line)}
tbody tr.blk + tr td, tbody tr.blk + tr th{border-top:0}
tbody tr.last td, tbody tr.last th{border-bottom:3px solid var(--line-strong)}
td.c{min-width:33px;height:30px;line-height:1.05;cursor:default;position:relative;border-left:1px solid color-mix(in srgb,var(--line) 55%,transparent)}
.ed td.c{cursor:pointer}
td.c small{display:block;font-size:9px;opacity:.75}
td.t-early,td.t-mid,td.t-night,td.t-day{background:transparent} td.t-rest{background:var(--t-rest);color:var(--muted)}
td.adj::after{content:"";position:absolute;right:0;top:0;border-style:solid;border-width:0 8px 8px 0;border-color:transparent #e0701b transparent transparent}
td.bad{outline:2px solid var(--danger);outline-offset:-2px;font-weight:700}
td.pick{outline:2px solid var(--accent);outline-offset:-2px}
tr.dim{opacity:.3}
td.st{min-width:34px;padding:0 4px;color:var(--muted);background:var(--surface)}
td.st.short{color:var(--danger);font-weight:700}
thead th.st{min-width:34px;padding:0 4px;font-size:11px}
tfoot td{position:sticky;bottom:0;background:var(--surface);z-index:3;border-top:2px solid var(--line-strong);height:24px;font-size:11px;color:var(--muted)}
tfoot td.nm{z-index:5;color:var(--fg)}
.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-top:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.card h3{margin:0 0 4px;font-size:12px;color:var(--muted);font-weight:500}
.card b{font-size:22px;font-variant-numeric:tabular-nums}
.issues{margin-top:12px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.issues h2{margin:0 0 6px;font-size:14px}
.issues ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:3px;max-height:220px;overflow:auto}
.issues li button{all:unset;cursor:pointer;display:block;padding:3px 6px;border-radius:4px;font-size:13px}
.issues li button:hover{background:var(--danger-soft)}
.issues .ok{color:var(--ok);font-weight:500}
.ov{position:fixed;inset:0;background:rgba(10,16,24,.5);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:max(20px,env(safe-area-inset-top,0px)) 12px 20px;overflow:auto}
.dlg{background:var(--surface);border-radius:10px;box-shadow:var(--shadow);width:min(720px,100%);padding:16px 18px;margin:auto 0}
.dlg h2{margin:0 0 10px;font-size:18px}
.dlg h4{margin:14px 0 6px;font-size:13px;color:var(--muted);font-weight:500}
.row{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin:6px 0}
.row label{display:flex;gap:6px;align-items:center}
.field{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:5px 8px;min-width:0}
.acts{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.note{color:var(--muted);font-size:12px}
.list{max-height:200px;overflow:auto;border:1px solid var(--line);border-radius:6px;padding:6px 10px;font-size:13px;background:var(--bg)}
.list.bad{border-color:var(--danger);background:var(--danger-soft)}
.pop{position:fixed;z-index:60;background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);padding:6px;display:grid;grid-template-columns:repeat(2,1fr);gap:4px;width:210px}
.pop button{border:1px solid var(--line);background:var(--bg);border-radius:5px;padding:5px 6px;text-align:left;font-size:13px}
.pop button:hover{border-color:var(--accent)}
.pop .cap{grid-column:1/-1;font-size:12px;color:var(--muted);padding:2px 4px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-top:6px}
.cal div{border-radius:5px;padding:3px 2px;text-align:center;font-size:12px;min-height:44px;background:var(--bg)}
.cal .h{min-height:0;color:var(--muted);font-size:11px;background:none}
.cal div b{display:block;font-size:10px;color:var(--muted);font-weight:400}
td.lv{background:var(--leave)!important;color:#1a1400!important;font-weight:700}
.dayb{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:4px 0;font-size:13px;line-height:1.1}
.dayb small{display:block;font-size:10px;color:var(--muted)}
.dayb.on{background:#e5484d;border-color:#e5484d;color:#fff}
.dayb.on small{color:#fff}
.pt{width:100%;border-collapse:collapse}
.pt th,.pt td{padding:3px 4px;text-align:left;font-size:13px}
.pt th{color:var(--muted);font-weight:500;font-size:12px}
.pt input[type=text]{width:100%}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:max(18px,env(safe-area-inset-bottom,0px));background:var(--line-strong);color:var(--bg);padding:8px 16px;border-radius:99px;z-index:80;font-size:13px;max-width:90vw}
@media (max-width:560px){.mnav strong{min-width:120px}.wrap{max-height:calc(100vh - 260px)}}
@media (prefers-reduced-motion:no-preference){.btn,.ib{transition:border-color .12s}}

thead th.lvh{background:var(--leave)!important;color:#1a1400!important;font-weight:700!important}
thead th.lvh span{color:#1a1400!important;font-weight:700!important}

/* 自己的那一列：姓名粗體並加外框，方便在全部組員中找到自己 */
tr.me th.nm button{font-weight:800;text-decoration:underline}
tr.me td.c{box-shadow:inset 0 1px 0 var(--fg),inset 0 -1px 0 var(--fg)}

/* 最後一欄「休」：本月休息天數；與日班 B01 不同的用淡紅底、白字（#cc4a4a 與白字對比度 4.5） */
th.rd,td.rd{min-width:46px;text-align:center;white-space:nowrap;border-left:2px solid var(--line-strong,var(--line))}
th.rd span{display:block;font-size:10px;font-weight:400;opacity:.8}
td.rd{font-weight:700}
td.rd.rdbad{background:#cc4a4a;color:#fff}

/* 排休紀錄 */
.lgt{border-collapse:collapse;font-size:13px;width:100%}
.lgt th,.lgt td{padding:4px 8px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
.lgt thead th{font-weight:700;position:sticky;top:0;background:var(--surface)}
.lgt td small{display:block;opacity:.7;font-size:11px}
.lgt tr.lga td{opacity:.85}

body{display:flex;align-items:center;justify-content:center;min-height:100vh;}
</style>
<div class="gate" style="position:static;min-height:100vh;background:var(--bg)">

<div class="acts"><button class="btn pri" type="submit">進入</button></div><p class="gate-err" id="gateerr" role="alert"></p></form>

const b64d=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function encUnlock(id){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(id),'PBKDF2',false,['deriveKey']);
  const kek=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64d(ENC.salt),iterations:ENC.iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  for(const w of ENC.wraps){
    try{ const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64d(w.iv)},kek,b64d(w.ct)); return JSON.parse(new TextDecoder().decode(pt)); }catch(e){}
  }
  return null;
}

const f=document.getElementById('gateform'), inp=document.getElementById('gatein'), err=document.getElementById('gateerr');
try{ sessionStorage.removeItem('shift_me'); sessionStorage.removeItem('shift_k'); sessionStorage.removeItem('shift_emp'); }catch(e){}
f.addEventListener('submit',async e=>{
  e.preventDefault();
  let v=(inp.value||'').trim().toLowerCase(); if(/^\d+$/.test(v)) v='c'+v;
  if(!/^c\d+$/.test(v)){ err.textContent='請只輸入數字工號'; return; }
  err.textContent='確認中，請稍候…';
  let res=null; try{ res=await encUnlock(v); }catch(x){ res=null; }
  if(!res){ err.textContent='工號不正確，或不在名單上'; inp.select(); return; }
  try{ sessionStorage.setItem('shift_me',res.pid); sessionStorage.setItem('shift_k',res.k); sessionStorage.setItem('shift_emp',v); }catch(x){}
  location.href='schedule.html';
});
setTimeout(()=>inp.focus(),50);
